<section id="solicitar" data-hu="HU45">
<h1>Solicitar información o capacitación</h1>
<form id="frm" class="card" novalidate>
<p>Los campos con * son obligatorios.</p>
<label for="n">Nombre *</label><input id="n" autocomplete="name"><p class="err" id="e-n" hidden></p>
<label for="c">Centro de atención *</label><input id="c"><p class="err" id="e-c" hidden></p>
<label for="m">Correo *</label><input id="m" type="email" autocomplete="email"><p class="err" id="e-m" hidden></p>
<label for="t">Qué necesitas *</label><select id="t"><option value="">Elige una opción</option><option>Información</option><option>Capacitación</option></select><p class="err" id="e-t" hidden></p>
<button class="btn" type="submit">Enviar solicitud</button>
<p id="ok" class="okmsg" role="status" hidden></p>
</form>
</section>
